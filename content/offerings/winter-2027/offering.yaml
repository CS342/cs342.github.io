# Course offering — the single source for dates, times, room, units, contacts and
# course-system links. Every page reads these values; change them here only.
#
# status values used throughout the content files:
#   confirmed  approved for this offering
#   draft      proposed or carried forward from a previous year; not yet approved
#   pending    not yet known ("to be announced")

id: winter-2027
title: "Building for Digital Health"
numbers: ["CS 342", "MED 253"]
term: "Winter 2027"
academicYear: "2026–2027"
previousYear: "2025–26"
description: "A project-based Stanford Biodesign course in which student teams build digital health applications with academic and industry mentors."

# All date and time calculations use this time zone.
timeZone: "America/Los_Angeles"
timeZoneLabel: "Pacific"

# Quarter boundaries (kept distinct from the Wednesday class meetings).
quarter:
  instructionBegins: "2027-01-04"
  classesEnd: "2027-03-12"

# Class meetings. Individual session dates are in sessions.yaml.
meeting:
  day: "Wednesday"
  start: "15:30"
  end: "18:20"

# Classroom. Wherever the room is shown, its name links to mapUrl (a map of the
# building). Leave name empty to show "to be announced".
room:
  name: "CCSR 4205"
  mapUrl: "https://campus-map.stanford.edu/?id=07-590"   # Center for Clinical Sciences Research
  status: confirmed

units:
  value: "3–4"
  status: draft
  note:            # optional line shown under the units on Home

# Course-system links. Leave empty until the 2027 link exists.
canvasUrl:

# Contacts, each maintained separately:
#   students  administrative and enrollment questions
#   course    course content, assignments, and projects
#   sponsors  project proposals
# In text they are available as {contactName:students}, {contactRole:students} and
# {contactEmail:students} (likewise course and sponsors).
contacts:
  students:
    name: "Meghana Nerurkar"
    role: "Course manager"
    email: "mnerur@stanford.edu"
    status: confirmed
  course:
    name: "Biodesign Digital Health team"
    role: "Course content"
    email: "speziteam@stanford.edu"
    status: confirmed
  sponsors:
    name: "Biodesign Digital Health team"
