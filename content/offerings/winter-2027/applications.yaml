# Application routes. Each route is configured independently.
#
# status
#   not-announced  shows "Application details forthcoming"; no button
#   opening-soon   shows the opening date (opensAt); no button
#   open           shows the deadline (closesAt) and an active button: to formUrl, or an
#                  "email your proposal" link when the route uses submitEmail
#   closed         shows the closed message; no button
#
# Safeguards built into the site:
#   - "open" without a formUrl or submitEmail is shown as "details forthcoming"
#     (never a dead button).
#   - Once closesAt has passed, an "open" route is shown as closed automatically.
#
# formUrl   the PUBLISHED respondent link (https://forms.gle/… or
#           https://docs.google.com/forms/d/e/…/viewform). Never the editing link
#           or the response sheet.
# submitEmail   the address submissions are emailed to, for a route that takes them by
#               email instead of a form. If both are set, the form is used.
# opensAt / closesAt   local date and time in the course time zone, "YYYY-MM-DDTHH:MM".
# signInNote   shown next to the button, e.g. "Requires a Stanford Google account."
# contact      students | sponsors  (see offering.yaml)

student:
  name: "Student application"
  action: "Apply for Winter 2027"
  status: not-announced
  formUrl:
  submitEmail:
  opensAt:
