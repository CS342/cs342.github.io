# What a project proposal must contain: the Winter 2027 call for proposals as
# supplied by the course team. It is shown on Propose a Project and on both route
# pages, so edit it here once. submitNote is the short reminder next to the
# submission panel at the foot of the academic and industry pages.
proposal:
  section:
    id: proposal
    label: "Proposal"
    title: "What to include in your proposal"
    status: confirmed
    statusNote: "Confirmed for {term}"
    body:
      - p: "Proposals should be approximately 1–2 pages long and should include:"
      - list:
          - "**Problem and intended users:** Describe the health need, who experiences it, and the outcome you hope to achieve."
          - "**Focused scope:** Identify 2–3 core capabilities that a student team could realistically prototype during the quarter."
          - "**Available resources:** Describe any existing designs, content, software, data sources, or technical infrastructure students could use."
          - "**Project readiness:** Identify technical dependencies, access requirements, and any approvals needed before work can begin."
          - "**Dedicated mentor:** Name a mentor who can meet with students weekly, provide feedback, and help make timely decisions."
          - "**Continuation plan:** Explain who will take ownership of the project and support its development or maintenance after the course."
          - "**Contact information:** Provide the organization, project lead, and preferred contact email."
      - note: "Please include only information suitable for initial review; omit patient information, credentials, and confidential material. Submission does not guarantee project selection."
  submitNote: "Proposals should be approximately 1–2 pages long and cover the points under [What to include in your proposal](#proposal). Submitting a proposal does not involve a payment or an agreement."

sponsors:
  lead: "We invite academic researchers, clinicians, and industry partners to propose projects for {course}, {term}. Student teams will work with project mentors to develop a focused digital health prototype during the ten-week course, {quarterRange}."
  sections:
    - id: scope
      label: "Scope"
      title: "What a team builds"
      status: draft
      statusNote: "Draft · to be confirmed"
      body:
        - p: "A team builds a focused minimum viable product (MVP) within the ten-week quarter. An MVP in this course is typically either a mobile or a web application built around two or three core capabilities that the project cannot do without."
        - p: "The result is an educational prototype, not a finished, supported product. It usually needs further development, validation, and operational support before it can be deployed."
    - id: selection
      label: "Selection"
      title: "How projects are selected"
      status: draft
      statusNote: "Draft · criteria and dates to be confirmed"
      body:
        - olist:
            - "**Propose.** Submit a proposal through the academic or the industry route."
            - "**Review.** The course team reviews proposals for fit, feasibility, and readiness."
            - "**Pitch.** Selected projects are pitched to students in the [first session](/sessions/week-1/)."
            - "**Match.** Students form teams around the projects, and building begins."
        - pending: "Review criteria and the selection timeline for {term} will be posted here."
    - id: after
      label: "After"
      title: "Handoff and work after the quarter"
      status: draft
      statusNote: "Draft · to be confirmed"
      body:
        - p: "At the end of the quarter the team hands its work off to the project sponsor. The sponsor keeps ownership of the project’s direction: continued development, deployment, hosting, and maintenance are the sponsor’s responsibility, which is why every proposal includes a continuation plan."
    - id: terms
      label: "Terms"
      title: "Costs and terms"
      status: pending
      statusNote: "To be announced"
      body:
        - pending: "Participation costs and terms for {term} have not been published. Approved terms will appear on the academic and industry pages."
        - p: "Submitting a proposal does not involve a payment or an agreement."

