      statusNote: "Eligibility to be confirmed"
      body:
        - p: "The course gives students the opportunity to apply their skills to real-world digital health projects, working in technical and multidisciplinary teams with the help of external mentors and industry experts."
        - pending: "Eligibility for {term} — including Stanford affiliation, programs, and year of study — will be published with the application."
    - id: preparation
      label: "Preparation"
      title: "Expected preparation"
      status: draft
      statusNote: "Carried forward from {previousYear} · to be confirmed"
      body:
        - p: "Teams will be coding throughout the quarter. We require that you have taken CS106A/B or equivalent. We highly recommend some experience with mobile platforms (CS193P/A, CS47), OR web platforms (CS142)."
    - id: commitment
      label: "Commitment"
      title: "Time commitment and attendance"
      status: draft
      statusNote: "Schedule confirmed · workload and attendance to be confirmed"
      body:
        - p: "The class meets {meetingPattern}, for {meetingCount} sessions from {firstClass} to {lastClass}."
        - p: "Teams can expect up to 8-10 hours of work each week beyond classroom hours."
        - p: "In person attendance is required. No more than one unexcused absence is permitted. See the [syllabus](/syllabus/#attendance) for details."
    - id: process
      label: "Process"
      title: "Dates and selection"
      status: pending
      statusNote: "To be announced"
      body:
        - pending: "The opening date, the deadline, the selection process, and when applicants can expect a decision will be posted here."
    - id: enrollment
      label: "Enrollment"
      title: "Applying and enrolling"
      status: pending
      statusNote: "To be announced"
