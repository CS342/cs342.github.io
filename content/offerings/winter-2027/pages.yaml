# Page copy that is not course data: Home ("How the course works", projects),
# the student application page, and the sponsor pages.
#
# Section bodies use the same blocks and placeholders as syllabus.yaml.
# Placeholders also include:
#   {course}        "CS 342 / MED 253: Building for Digital Health"
#   {courseRange}   first to last class meeting, "January 6–March 10, 2027"
#   {deadline:academic} {deadline:industry}   proposal deadlines, from applications.yaml
#   {notifyBy:academic} {notifyBy:industry}   decision dates, from applications.yaml
#
# A section shows a status tag only when it sets both status and statusNote.
# The course team approved the copy below for Winter 2027 on 2026-11-17, so
# these sections carry no tags. Add status and statusNote back to mark a section
# as draft or pending.

home:
  process:
    title: "How the course works"
    steps:
      - title: "Project selection"
        text: "Academic and industry partners propose projects. Teaching team selects projects for the course."
      - title: "Team formation"
        text: "Projects are pitched in the first session and students form teams."
      - title: "Building and mentoring"
        text: "Teams build iteratively, with guidance from project mentors and the teaching team."
      - title: "Midterm"
        text: "Midway through the quarter, teams present their progress and working functionality."
      - title: "Final demonstration"
        text: "In the last session, teams present their final project to their project mentors and a panel of digital health experts."
    after: "Handoff to the project sponsor"
  projects:
    status: pending
    text: "Winter 2027 projects will be announced here once they are selected."

apply:
  lead:            # optional line under the page title
  sections:
    - id: who
      label: "Who"
      title: "Who should apply"
      body:
        - p: "Students who are excited about the opportunity to apply their skills to real-world digital health projects, working in technical and multidisciplinary teams with mentors across academia and industry."
    # The same wording appears under Prerequisites in syllabus.yaml; change both together.
    - id: prerequisites
      label: "Prerequisites"
      title: "Prerequisites"
      body:
        - p: "We welcome all skills and backgrounds. Teams will be coding throughout the quarter using AI agents. We recommend that you have taken CS106A/B or equivalent. We highly recommend some experience with mobile platforms (CS193P/A, CS47), OR web platforms (CS142)."
    - id: commitment
      label: "Commitment"
      title: "Time commitment and attendance"
      body:
        - p: "The class meets {meetingPattern}, for {meetingCount} sessions from {firstClass} to {lastClass}."
        - p: "Teams can expect up to 8-10 hours of work each week beyond classroom hours."
        - p: "In person attendance is required. No more than one unexcused absence is permitted. See the [syllabus](/syllabus/#attendance) for details."

# What a project proposal must contain: the Winter 2027 call for proposals as
# supplied by the course team. It is shown on Propose a Project and on both route
# pages, so edit it here once. submitNote is the short reminder next to the
# submission panel at the foot of the academic and industry pages.
proposal:
  section:
    id: proposal
    label: "Proposal"
    title: "What to include in your proposal"
    body:
      - p: "Proposals should be approximately 1–2 pages long and should include:"
      - list:
          - "**Problem and intended users:** Describe the health need, who experiences it, and the outcome you hope to achieve."
          - "**Focused scope:** Identify 2–3 core capabilities that a student team could realistically prototype during the quarter."
          - "**Available resources:** Describe any existing designs, content, software, data sources, or technical infrastructure students could use."
          - "**Project readiness:** Identify technical dependencies, access requirements, and any approvals needed before work can begin."
          - "**Dedicated mentor:** Name a mentor who can meet with students weekly, provide feedback, and help make timely decisions."
          - "**Continuation plan:** Explain who will take ownership of the project and support its development or maintenance after the course."
          - "**Contact information:** Provide the organization, project lead, and preferred contact email."
      - note: "Please leave patient information, credentials, and confidential material out of your submission."
  submitNote: "Proposals should be approximately 1–2 pages long and cover the points under [What to include in your proposal](#proposal). Submitting a proposal does not involve a payment or an agreement."

sponsors:
  lead: "We invite academic researchers, clinicians, and industry mentors to propose projects for {course}, {term}. Student teams will work with project mentors to develop a focused digital health prototype during the ten-week course, {courseRange}."
  sections:
    - id: scope
      label: "Scope"
      title: "Goal of the Course"
      body:
        - p: "A team builds a focused minimum viable product (MVP) within the ten-week quarter. An MVP in this course is typically either a mobile or a web application built around two or three core capabilities that the project cannot do without."
        - p: "The result is an educational prototype, not a finished, supported product. While the course enables rapid creativity and development, the product sometimes needs further development, validation, and operational support before it can be fully deployed. Many students elect to stay involved in the project following the course to continue pushing the ideas forward."
    - id: selection
      label: "Selection"
      title: "How projects are selected"
      body:
        - olist:
            - "**Propose.** Submit a proposal through the academic or the industry route."
            - "**Review.** The course team reviews proposals for fit, feasibility, and readiness."
            - "**Pitch.** Selected projects are pitched to students in the [first session](/sessions/week-1/)."
            - "**Match.** Students form teams around the projects, and building begins."
        - p: "The deadline for project proposals is {deadline:academic}. We will notify project submitters by {notifyBy:academic} about project selection."
    - id: after
      label: "After"
      title: "Handoff and work after the quarter"
      body:
        - p: "At the end of the quarter the team hands its work off to the project sponsor. The sponsor keeps ownership of the project’s direction: continued development, deployment, hosting, and maintenance are the sponsor’s responsibility, which is why every proposal includes a continuation plan."
    - id: terms
      label: "Terms"
      title: "Costs and terms"
      body:
        - p: "Costs for academic projects are $5,000. For industry projects, the cost is $20,000. These costs support resources for the course."
        - p: "Submitting a proposal does not involve a payment or an agreement."

academic:
  lead: "We invite academic researchers and clinicians to propose projects for {term}. A student team will work with your project mentor to develop a focused digital health prototype during the ten-week course, {courseRange}."
  sections:
    - id: eligibility
      label: "Eligibility"
      title: "Who can propose"
      body:
        - p: "The academic route is for academic researchers and clinicians. In previous years, academic projects were led by Stanford faculty with the authority and initiative to act as principal investigator for the project."
    - id: approvals
      label: "Approvals"
      title: "Approvals and data"
      body:
        - p: "Projects that involve research participants or protected data need their own approvals, such as IRB review and a data risk assessment. These remain the responsibility of the project lead. Identify them in your proposal under project readiness."
    - id: costs
      label: "Costs"
      title: "Participation costs"
      body:
        - p: "The cost for an academic project is $5,000. This cost supports resources for the course."

industry:
  lead: "We invite industry mentors to propose projects for {term}. A student team will work with your project mentor to develop a focused digital health prototype during the ten-week course, {courseRange}."
  sections:
    - id: eligibility
      label: "Eligibility"
      title: "Who can propose"
      body:
        - p: "The industry route is for companies, large or small, with a digital health idea that a student team could turn into a first prototype."
    - id: purpose
      label: "Purpose"
      title: "Purpose of the partnership"
      body:
        - list:
            - "**Student engagement.** Work closely with a student team for a quarter."
            - "**Fresh perspectives.** See a longstanding challenge approached by the next generation of engineers and developers."
            - "**A first prototype.** Take an idea to a working MVP built around two or three core capabilities."
    - id: terms
      label: "Terms"
      title: "Sponsorship costs, agreements, and IP"
      body:
        - p: "The cost for an industry project is $20,000. This cost supports resources for the course."
        - p: "Questions about agreements, intellectual property, or source-code arrangements are handled directly with course staff, outside this website. You can raise them in your proposal for follow-up."
