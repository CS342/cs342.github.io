        - pending: "Whether research partners at other institutions may propose projects for {term} will be confirmed here."
    - id: approvals
      label: "Approvals"
      title: "Approvals and data"
      status: draft
      statusNote: "Draft · expectations to be confirmed"
      body:
        - p: "Projects that involve research participants or protected data need their own approvals, such as IRB review and a data risk assessment. These remain the responsibility of the project lead. Identify them in your proposal under project readiness."
        - pending: "Project-specific approval expectations for {term} will be posted here."
    - id: costs
      label: "Costs"
      title: "Participation costs"
      status: pending
      statusNote: "To be announced"
      body:
        - pending: "Participation costs for academic projects in {term} have not been published. Approved terms will appear here."

industry:
  lead: "We invite industry partners to propose projects for {term}. A student team will work with your project mentor to develop a focused digital health prototype during the ten-week course, {quarterRange}."
  sections:
    - id: eligibility
      label: "Eligibility"
      title: "Who can propose"
      status: draft
      statusNote: "Draft · eligibility to be confirmed"
