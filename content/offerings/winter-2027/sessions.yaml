# Class sessions. Start/end times and the room come from offering.yaml unless a
# session overrides them (start, end, room).
#
# slug           stable URL (/sessions/<slug>/). Do not change it when a title changes.
# dateStatus     confirmed | draft | pending   — is the date fixed?
# contentStatus  confirmed | draft | pending   — are topic, agenda and speakers fixed?
# statusLabel    short public wording for the content status
# guest          tba = show "Speaker to be announced"; none = no guest slot
# speakers       [{ name, affiliation, url }]  — confirmed speakers only
# agenda         [{ time: "3:30 pm", item: "…" }]  — time is optional
# resources      [{ label, url, type, access, description }]
#                type: slides | recording | code | reading | workshop | link
#                access: public | stanford | course   (leave url empty to show "forthcoming")
# deliverables   [{ title, due: "2027-01-20T23:59", submit, access, note }]
#                Leave due empty until the deadline is approved. Deadlines are never
#                inferred from the class date.

