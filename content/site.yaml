# Site-wide settings.
# Everything specific to one year of the course lives in content/offerings/<id>/.

# Which offering the site shows. To start a new year, copy the offering folder,
# rename it (e.g. winter-2028), update its files, and change this value.
currentOffering: winter-2027

# review = show the review banner and ask search engines not to index the site.
# live   = public launch (banner removed, indexing allowed).
launchStatus: live
reviewNotice: "Preview — this site is under course-team review. Details may change before launch."

# Program affiliations shown in the footer.
affiliation:
  statement: "Building for Digital Health is a Biodesign course sponsored by the Stanford School of Medicine and Stanford’s Computer Science department."
  links:
