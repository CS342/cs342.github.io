      url: "https://biodesign.stanford.edu/"
    - label: "Stanford Biodesign Digital Health"
      url: "https://bdh.stanford.edu/"
    - label: "Stanford Spezi"
      url: "https://spezi.stanford.edu/"

address:
  - "Stanford Mussallem Center for Biodesign"
  - "318 Campus Drive, E100"
  - "Stanford, CA 94305"

# Institutional footer line. Pending course-team approval of footer language.
copyright: "© Stanford University"

